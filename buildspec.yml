
version: 0.2

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com
  build:
    commands:
      - docker build -t web-app .
      - docker tag web-app:latest $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/web-app:latest
  post_build:
    commands:
      - docker push $ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/web-app:latest
